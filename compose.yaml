services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: agent-bridge-mqtt
    restart: unless-stopped
    ports:
      # Anonymous access is only safe while the port is bound to loopback.
      - 127.0.0.1:1883:1883
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - data:/mosquitto/data
  ledgerd:
    # The Rust ledgerd (rust/Dockerfile); agent-bridge-ledgerd:2 is the Python one, built from the root Dockerfile.
    build: rust
    image: agent-bridge-ledgerd:rust
    container_name: agent-bridge-ledgerd
    restart: unless-stopped
    environment:
      AGENT_BRIDGE_HOST: mosquitto
      LEDGER_DB: /data/ledger.db
    volumes:
      # A named volume, not a host directory, so the root-owned container never takes over host files.
      - ledger:/data
    healthcheck:
      # A round trip through the broker, so it fails when ledgerd is disconnected or wedged, not just when it exits.
      test: ["CMD", "/agent-bridge-ledgerd", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - mosquitto
  historyd:
    # The Python historyd from the root Dockerfile, the reference until the Rust port lands.
    build: .
    image: agent-bridge-historyd:1
    container_name: agent-bridge-historyd
    restart: unless-stopped
    command: ["agent-bridge-historyd"]
    environment:
      AGENT_BRIDGE_HOST: mosquitto
      HISTORY_DB: /data/history.db
      HISTORY_IMPORT: /import/history.jsonl
    volumes:
      - history:/data
      # The host's legacy history log, imported once on the first start and never changed (read-only).
      - ${HOME}/.local/state/agent-bridge:/import:ro
    healthcheck:
      # A round trip through the broker, so it fails when historyd is disconnected or wedged, not just when it exits.
      test: ["CMD", "agent-bridge-historyd", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - mosquitto
volumes:
  data:
  ledger:
  history:
