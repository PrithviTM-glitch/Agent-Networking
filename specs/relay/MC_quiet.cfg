\* MUST FAIL AckAfterInbox: relay wake's quiet backlog as built (relay.rs:224-233). A finding, see README.md.
\* A quiet message is acked before any inbox write, and NoLoss fails too when the session ends with it in memory.
SPECIFICATION Spec
CONSTANTS
    Msgs = {m1, m2}
    MaxGen = 4
    AckBeforeInbox = FALSE
    QuietFilter = TRUE
INVARIANTS AckAfterInbox TypeOK NoLoss
