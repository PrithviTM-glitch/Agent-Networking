\* MUST FAIL AckAfterInbox: the deliberately broken order (ack, then the inbox write). If it passes, the spec does not bite.
\* NoLoss fails too: once acked, the message lives only in the relay's memory (mirror.py --trace MC_broken.cfg NoLoss).
SPECIFICATION Spec
CONSTANTS
    Msgs = {m1, m2}
    MaxGen = 4
    AckBeforeInbox = TRUE
    QuietFilter = FALSE
INVARIANTS AckAfterInbox TypeOK NoLoss
