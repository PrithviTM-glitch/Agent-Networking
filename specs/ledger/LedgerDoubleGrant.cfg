\* MUST FAIL AtMostOnce: the 0.2.1 double grant. An answer is kept only Dedupe ticks, less than a request's Life, so a late redelivery runs again.
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    MaxTime = 6
    TTL = 2
    Wait = 4
    Life = 3
    Dedupe = 1
    MaxKeep = 8
    Margin = 1
    MaxDeliveries = 3
    MaxReqs = 2
    KeepForLifetime = FALSE
    CapWaitAtExpiry = TRUE
    FencePersisted = TRUE
INVARIANTS
    TypeOK
    AtMostOneWriteLease
    FencingIncreases
    AtMostOnce
    LeaseOnlyToListener
CHECK_DEADLOCK FALSE
