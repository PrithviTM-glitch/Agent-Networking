\* ledgerd as it is: every invariant holds. 2 clients, 1 resource, 3 deliveries per message, ticks 0..6.
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    MaxTime = 6
    TTL = 2
    Wait = 4
    Life = 3
    Dedupe = 1
    MaxKeep = 8
    Margin = 1
    MaxDeliveries = 3
    MaxReqs = 2
    KeepForLifetime = TRUE
    CapWaitAtExpiry = TRUE
    FencePersisted = TRUE
INVARIANTS
    TypeOK
    AtMostOneWriteLease
    FencingIncreases
    AtMostOnce
    LeaseOnlyToListener
CHECK_DEADLOCK FALSE
