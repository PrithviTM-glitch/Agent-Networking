[workspace]
members = ["crates/core", "crates/cli", "crates/ledgerd"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/PrithviTM-glitch/Agent-Networking"

[workspace.dependencies]
agent-bridge-core = { path = "crates/core" }
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive"] }
getrandom = "=0.4.3"
libc = "=0.2.191"
nix = { version = "=0.31.3", features = ["fs", "signal", "process", "user"] }
rumqttc = { version = "=0.25.1", default-features = false }
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde = "=1.0.229"
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = "=0.11.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
