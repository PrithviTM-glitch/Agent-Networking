[project]
name = "agent-bridge"
dynamic = ["version"]
description = "A local message bus, resource ledger and admin console for Claude Code sessions, over MQTT 5."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp==1.30.0",
    "paho-mqtt==2.1.0",
]

[project.urls]
Repository = "https://github.com/PrithviTM-glitch/Agent-Networking"
Issues = "https://github.com/PrithviTM-glitch/Agent-Networking/issues"

[project.scripts]
agent-bridge = "agent_bridge.cli:main"
agent-bridge-ledger = "agent_bridge.ledger.client:main"
agent-bridge-ledgerd = "agent_bridge.ledger.service:main"
agent-bridge-historyd = "agent_bridge.history.service:main"
agent-bridge-mcp = "agent_bridge.mcp_server:main"
agent-bridge-console = "agent_bridge.console.server:main"
agent-bridge-admin = "agent_bridge.console.cli:main"
agent-bridge-relay-hook = "agent_bridge.claude.hooks:relay_start"
agent-bridge-broadcast-hook = "agent_bridge.claude.hooks:broadcast"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[tool.maturin]
# The Rust extension agent_bridge._native, next to the Python sources; the version comes from rust/Cargo.toml.
manifest-path = "rust/crates/py/Cargo.toml"
module-name = "agent_bridge._native"
python-source = "src"
# Generated by cargo-about in CI (build.yml); gitignored, so maturin would otherwise skip it.
include = [{ path = "src/agent_bridge/THIRD_PARTY_LICENSES.md", format = "wheel" }]

[tool.uv]
# uv rebuilds the extension when these change, not only when pyproject.toml does.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/Cargo.toml" },
    { file = "rust/Cargo.lock" },
    { file = "rust/crates/py/**/*.rs" },
    { file = "rust/crates/py/Cargo.toml" },
    { file = "rust/crates/core/**/*.rs" },
    { file = "rust/crates/core/Cargo.toml" },
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
