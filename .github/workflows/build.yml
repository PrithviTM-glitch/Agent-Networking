name: build
# Called by ci.yml and release.yml: manylinux wheels and the sdist, uploaded as artifacts.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  licenses:
    # The license texts of every Rust crate the wheel ships, generated so they always match Cargo.lock.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: rust
      - run: cargo install --locked --features cli cargo-about@0.9.3
      - run: >-
          cargo about generate --workspace --locked -c config/about.toml -m rust/Cargo.toml
          -o THIRD_PARTY_LICENSES.md config/about.hbs
      - uses: actions/upload-artifact@v7
        with:
          name: licenses
          path: THIRD_PARTY_LICENSES.md
          if-no-files-found: error
  wheels:
    needs: licenses
    strategy:
      matrix:
        target: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: licenses
          path: src/agent_bridge
      - uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: 2_28
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
