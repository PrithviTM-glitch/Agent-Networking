name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: The tag must match the package version
        run: |
          sdist=(dist/agent_bridge-*.tar.gz)
          version=${sdist[0]#dist/agent_bridge-}
          version=${version%.tar.gz}
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
  pypi:
    # Off until the repository variable PUBLISH_TO_PYPI is "true" and PyPI trusts this workflow (environment "pypi").
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: github-release
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.3
