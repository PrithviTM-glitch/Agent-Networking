name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  notes:
    # The release notes are the tag's section of CHANGELOG.md; a tag without one fails here, before anything is built.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
  build:
    needs: notes
    uses: ./.github/workflows/build.yml
  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: The tag must match the package version
        run: |
          sdist=(dist/agent_bridge-*.tar.gz)
          version=${sdist[0]#dist/agent_bridge-}
          version=${version%.tar.gz}
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          --notes-file notes/release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
  pypi:
    # Off until the repository variable PUBLISH_TO_PYPI is "true" and PyPI trusts this workflow (environment "pypi").
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: github-release
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.3
