name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      # Only the dev tools: syncing the project itself would compile the Rust extension.
      - run: uv sync --frozen --only-group dev
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: rust
      - run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --workspace
  build:
    uses: ./.github/workflows/build.yml
  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/download-artifact@v8
        with:
          name: wheel-x86_64
          path: dist
      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl
      - name: Check the entry points, the extension and the packaged files
        working-directory: /tmp
        run: |
          for cmd in agent-bridge agent-bridge-ledger agent-bridge-ledgerd agent-bridge-historyd agent-bridge-mcp \
                     agent-bridge-console agent-bridge-admin agent-bridge-relay-hook agent-bridge-broadcast-hook; do
            test -x "/tmp/wheel-env/bin/$cmd" || { echo "missing $cmd"; exit 1; }
          done
          # Every command with arguments must answer --help without starting anything (the hooks read stdin instead).
          for cmd in agent-bridge agent-bridge-ledger agent-bridge-ledgerd agent-bridge-historyd agent-bridge-mcp \
                     agent-bridge-console agent-bridge-admin; do
            timeout 10 "/tmp/wheel-env/bin/$cmd" --help < /dev/null > /dev/null || { echo "$cmd --help failed"; exit 1; }
          done
          /tmp/wheel-env/bin/python -I -c '
          import importlib, importlib.metadata, pathlib
          import agent_bridge._native as native
          assert native.__version__ == importlib.metadata.version("agent-bridge"), native.__version__
          for m in ("cli", "relay", "mcp_server", "ledger.service", "history.service", "claude.hooks", "console.server"):
              importlib.import_module(f"agent_bridge.{m}")
          import agent_bridge.console as c
          static = pathlib.Path(c.__file__).parent / "static"
          missing = [f for f in ("index.html", "app.js", "app.css") if not (static / f).is_file()]
          assert not missing, f"not packaged: {missing}"
          licenses = pathlib.Path(c.__file__).parent.parent / "THIRD_PARTY_LICENSES.md"
          assert "## MIT License" in licenses.read_text(), "third-party licenses not packaged"
          '
  test:
    # The Python suite as the conformance harness, against the built wheel rather than the source tree.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/download-artifact@v8
        with:
          name: wheel-x86_64
          path: dist
      - run: docker pull eclipse-mosquitto:2.0.22
      - name: Install the wheel and the test tools
        run: |
          uv venv .venv-wheel
          uv pip install --python .venv-wheel/bin/python dist/*.whl pytest==9.1.1 paho-mqtt==2.1.0
      - run: .venv-wheel/bin/python -m pytest -p no:cacheprovider
  docker:
    # The service images: the Rust ledgerd and historyd Compose builds from rust/, and the Python rollback image from
    # the root Dockerfile. Each service answers --help without a network.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target ledgerd -t agent-bridge-ci:ledgerd rust
      - run: docker run --rm --network none agent-bridge-ci:ledgerd /agent-bridge-ledgerd --help
      - run: docker build --target historyd -t agent-bridge-ci:historyd rust
      - run: docker run --rm --network none agent-bridge-ci:historyd /agent-bridge-historyd --help
      - run: docker build -t agent-bridge-ci:python .
      - run: docker run --rm --entrypoint python agent-bridge-ci:python -I -c 'import agent_bridge._native, agent_bridge.history.service, agent_bridge.ledger.service'
      - run: docker run --rm --network none agent-bridge-ci:python agent-bridge-ledgerd --help
      - run: docker run --rm --network none agent-bridge-ci:python agent-bridge-historyd --help
  interop:
    # Python and Rust side by side: the Rust tests that need Docker, and the parity tests that hand one database
    # between the Python and Rust services (they skip unless AGENT_BRIDGE_HISTORYD / AGENT_BRIDGE_LEDGERD point at Rust).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: rust
      - run: docker pull eclipse-mosquitto:2.0.22
      - run: uv sync --frozen
      - run: cargo test --manifest-path rust/Cargo.toml --workspace -- --ignored
      - run: cargo build --release --manifest-path rust/Cargo.toml -p agent-bridge-historyd -p agent-bridge-ledgerd
      - run: uv run --no-sync pytest -p no:cacheprovider tests/test_history_parity.py tests/test_ledger_parity.py
        env:
          AGENT_BRIDGE_HISTORYD: ${{ github.workspace }}/rust/target/release/agent-bridge-historyd
          AGENT_BRIDGE_LEDGERD: ${{ github.workspace }}/rust/target/release/agent-bridge-ledgerd
